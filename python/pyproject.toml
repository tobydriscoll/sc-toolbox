[build-system]
requires = ["scikit-build-core >=0.8", "nanobind >=1.9"]
build-backend = "scikit_build_core.build"

[project]
name = "sctoolbox"
version = "0.1.0"
description = "Schwarz-Christoffel conformal mapping toolbox (Python bindings over the C++ port)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-2-Clause" }
authors = [{ name = "SC Toolbox contributors" }]
keywords = ["conformal", "schwarz-christoffel", "complex-analysis", "pde", "mapping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
examples = ["matplotlib"]
test = ["pytest", "numpy"]

[tool.scikit-build]
# The extension module lives under src/sctoolbox/; wheel.packages points the
# build at the Python sources, and CMake installs the compiled _sctoolbox
# module alongside them.
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/sctoolbox"]

[tool.scikit-build.cmake.define]
SCTOOLBOX_BUILD_TESTS = "OFF"
